# Every push to main and every pull request into it: the repo's checks, every workspace's tests, the runtime tests
# again on the oldest supported Node (22.13), the server's browser tests, the npm packages installed in a new site
# (Node 24 and 22.13), the server image (built and smoke-tested on a site made from the starter), an audit of the
# runtime dependencies and a secrets scan. CONTRIBUTING.md says what each one guards.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the release test counts commits for the build number
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # the tests make git commits in their own throwaway repos
      - name: Git identity for test commits
        run: |
          git config --global user.name "Markstage CI"
          git config --global user.email "ci@example.com"
      - name: Install (exactly the lockfile)
        run: npm ci
      - name: Types (editor)
        run: npm run typecheck
      - name: No file over 1000 lines
        run: npm run lines
      - name: No site's names in the packages or the repo
        run: npm run generic
      - name: Licence words (source-available, Elastic License 2.0)
        run: npm run licence
      - name: Tests, repo scripts (publish kit, secret scan, SECURITY.md versions)
        run: npm run test:scripts
      - name: Public site (site/ equals a fresh build; titles, descriptions, links, JSON-LD)
        run: npm run site:test
      - name: Tests, core
        run: npm test -w packages/core
      # a few editor tests draw in a real browser (raw HTML, Word paste)
      - name: Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Tests, editor
        run: npm test -w packages/editor
      - name: Tests, Astro integration
        run: npm test -w packages/astro
      - name: Tests, server (unit; the browser tests are the e2e job)
        run: npm run test:unit -w packages/server
      - name: Tests, example blog
        run: npm test -w examples/blog
      - name: Tests, starter site (builds; the editor and its API answer in astro dev)
        run: npm test -w examples/starter
      - name: Audit of the runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  # Markstage runs on Node 22.13 or newer (engines). The runtime packages' tests run on that oldest version too; the
  # editor's own tests are TypeScript run directly by Node, which needs Node 24, so they stay in the job above.
  node-22:
    name: Runtime tests on Node 22.13 (core, Astro integration, server unit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A zone far from UTC (the other jobs run in UTC), so a test that reads the machine's own time zone fails here
    # instead of on a contributor's laptop (a sign-in alert test once passed only in the Toronto zone).
    env:
      TZ: Pacific/Auckland
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the release test counts commits for the build number
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Git identity for test commits
        run: |
          git config --global user.name "Markstage CI"
          git config --global user.email "ci@example.com"
      - name: Install (exactly the lockfile)
        run: npm ci
      - name: Tests, core
        run: npm test -w packages/core
      - name: Tests, Astro integration
        run: npm test -w packages/astro
      - name: Tests, server (unit)
        run: npm run test:unit -w packages/server

  e2e:
    name: Server browser tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the release test counts commits for the build number
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Git identity for test commits
        run: |
          git config --global user.name "Markstage CI"
          git config --global user.email "ci@example.com"
      - name: Install (exactly the lockfile)
        run: npm ci
      # the browser tests copy the preview agent the editor build emits; npm ci does not build it
      - name: Build the editor's preview agent
        run: npm run build:agent -w packages/editor
      - name: Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Browser tests (a skip fails the run)
        run: npm run test:e2e -w packages/server
        env:
          MARKSTAGE_E2E_REQUIRED: "1"

  # The npm packages installed for real (scripts/npm-install.mjs, docs/PUBLISHING.md "npm"): the four tarballs `npm
  # pack` makes, in a new site from the starter (no links), `astro build`, `markstage build-editor`, `astro dev`, the
  # server, and a post saved in the editor in Chromium as a git commit. On Node 24, and on the oldest Node Markstage
  # supports (22.13): Astro 7.4 itself needs 22.23.4 or newer on the 22 line, so there `astro build` runs on Node 24
  # (MARKSTAGE_ASTRO_NODE) and `astro dev` is left out, while the install, the editor build, the server, the editor and
  # the save run on 22.13. What each tarball holds is checked by scripts/npm-packages.test.mjs (test:scripts above).
  npm-install:
    name: npm install test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '22.13.0']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the release line counts commits for the build number
      # a Node that Astro allows, for `astro build` on the 22.13 leg
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Remember Node 24 for Astro
        run: echo "MARKSTAGE_ASTRO_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Git identity for the test commits
        run: |
          git config --global user.name "Markstage CI"
          git config --global user.email "ci@example.com"
      - name: Install (exactly the lockfile)
        run: npm ci
      - name: Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Pack, install in a new site, build, serve, edit and save
        run: npm run test:npm-install

  # The server image (deploy/Dockerfile) on every push and pull request: built for amd64, then started on a new site
  # from the starter, the way docs/DOCKER.md says (health, the editor, sign-in setup, the API, a publish inside the
  # container). Nothing is pushed here; .github/workflows/image.yml publishes on a v* tag in the public repo.
  docker:
    name: Server image (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the image's release line counts commits for the build number
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Release facts for the image (docs/RELEASES.md)
        id: facts
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: markstage-server:ci
          build-args: |
            MARKSTAGE_VERSION=${{ steps.facts.outputs.version }}
            MARKSTAGE_COMMIT=${{ steps.facts.outputs.commit }}
            MARKSTAGE_BUILD=${{ steps.facts.outputs.build }}
            MARKSTAGE_BUILT_AT=${{ steps.facts.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Git identity for the new site's first commit
        run: |
          git config --global user.name "Markstage CI"
          git config --global user.email "ci@example.com"
      - name: Smoke test (a new site from the starter, run with the image)
        run: node scripts/docker/smoke.mjs --image markstage-server:ci

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum checked)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # the whole history, with the repo's .gitleaks.toml (two published test vectors allowed, nothing else)
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git . --no-banner --redact --verbose'

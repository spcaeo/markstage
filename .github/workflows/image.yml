# Publishes the server image (deploy/Dockerfile) to the GitHub Container Registry when a release tag vX.Y.Z is pushed:
# ghcr.io/spcaeo/markstage:X.Y.Z, and :latest for a release that is not a pre-release (no "-" in the tag). It runs
# only in the public repo (spcaeo/markstage); in any other copy the job is skipped. Before anything is pushed, the
# image is built for amd64 and smoke-tested like CI does (scripts/docker/smoke.mjs); then it is built for amd64 and
# arm64 and pushed with an SBOM and build provenance. docs/DOCKER.md, docs/PUBLISHING.md ("Releases: the order").
name: Image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'spcaeo/markstage'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/spcaeo/markstage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the release line counts commits for the build number
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The tag is the version in package.json
        id: facts
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then echo "The tag says $tag but package.json says $version: nothing is published." >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          tags="$IMAGE:$version"
          case "$version" in *-*) ;; *) tags="$tags,$IMAGE:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for the smoke test (amd64, kept local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: markstage-server:release-check
          build-args: |
            MARKSTAGE_VERSION=${{ steps.facts.outputs.version }}
            MARKSTAGE_COMMIT=${{ steps.facts.outputs.commit }}
            MARKSTAGE_BUILD=${{ steps.facts.outputs.build }}
            MARKSTAGE_BUILT_AT=${{ steps.facts.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Git identity for the new site's first commit
        run: |
          git config --global user.name "Markstage CI"
          git config --global user.email "ci@example.com"
      - name: Smoke test
        run: node scripts/docker/smoke.mjs --image markstage-server:release-check
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for amd64 and arm64, and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.facts.outputs.tags }}
          build-args: |
            MARKSTAGE_VERSION=${{ steps.facts.outputs.version }}
            MARKSTAGE_COMMIT=${{ steps.facts.outputs.commit }}
            MARKSTAGE_BUILD=${{ steps.facts.outputs.build }}
            MARKSTAGE_BUILT_AT=${{ steps.facts.outputs.built_at }}
          labels: |
            org.opencontainers.image.version=${{ steps.facts.outputs.version }}
            org.opencontainers.image.revision=${{ steps.facts.outputs.commit }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

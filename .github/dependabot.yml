# Dependency updates (CONTRIBUTING.md, "Dependencies"): once a week, minor and patch updates in one pull request
# per ecosystem; a major update comes on its own so it is read before it is merged. Every pull request runs CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch

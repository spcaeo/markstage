# The static site, with password-protected pages checked by Markstage (nginx auth_request).
# Used by deploy/compose.yaml; docs/DEPLOY.md has the production version (TLS, real host names).
#
# Markstage config.json for this file:
#   "protectedPages": { "dir": "/srv/site/current/private", "hosts": ["<the site's Host header>"] }
#   "siteHosts": ["<the site's Host header>"]     (its forms: POST /markstage/forms/<id>)
#   "trustProxy": true
# Requests from this host reach only Markstage's page gate and forms; the CMS API and editor answer 404 here.

upstream markstage {
  server markstage:18231;
}

server {
  listen 80;
  server_name _;
  root /srv/site/current/public;     # `current` is switched atomically by markstage-deploy
  server_tokens off;

  # nginx files the build emits (redirect maps, includes) are server config, not pages
  location ^~ /_nginx/ {
    return 404;
  }

  # PDFs are stored as uploaded (never re-encoded, docs/SECURITY.md "Uploads"): served as downloads, never opened
  # in the browser on the site's origin, and never sniffed into something else
  location ~* \.pdf$ {
    try_files $uri =404;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # $uri/index.html, not $uri/: a protected page's folder can still exist in the public build (it holds public
  # child pages), and `$uri/` would match that folder and answer 403 instead of asking Markstage
  location / {
    try_files $uri $uri/index.html @protected;
  }

  # Not in the public build: perhaps a protected page. Markstage says 204 for a valid page cookie, else 401.
  location @protected {
    auth_request /markstage/page-auth;
    error_page 401 = @gate;
    root /srv/site/current/private;
    try_files $uri $uri/index.html =404;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
  }

  location = /markstage/page-auth {
    internal;
    proxy_pass http://markstage;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;               # with the port: it must match protectedPages.hosts
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # No valid cookie: Markstage shows the password form for a protected page, or 404 (then the site's own 404 page).
  location @gate {
    proxy_pass http://markstage;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_intercept_errors on;
    error_page 404 /404.html;
  }

  # The password form (rate-limited, sets the page cookie) and the site's forms (POST /markstage/forms/<id>) post here.
  location /markstage/ {
    proxy_pass http://markstage;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 64k;
  }

  error_page 404 /404.html;
}

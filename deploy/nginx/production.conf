# Production nginx for Markstage + a static site (no Docker needed). Replace www.example.com, cms.example.com and
# the certificate paths, then: nginx -t && systemctl reload nginx.
#
#   https://cms.example.com/markstage/   the editor and API (Markstage publicOrigin = https://cms.example.com)
#   https://www.example.com/             the static site from /srv/site/current/public (switched by markstage-deploy)
#   https://www.example.com/markstage/   the protected-page gate (unlock form) and the site's forms; the CMS API answers 404 here
#   https://preview.example.com/         previews of unsaved work (Markstage preview.origin, listener 18245)
#   https://share.example.com/           share links: a release's or a draft's preview for people without an
#                                        account (Markstage share.origin, listener 18251)
#
# Markstage config.json: "publicOrigin": "https://cms.example.com", "trustProxy": true,
#   "protectedPages": { "dir": "/srv/site/current/private", "hosts": ["www.example.com"] },
#   "siteHosts": ["www.example.com"]   (the site's forms post to /markstage/forms/<id> on it)
# Keep the CMS on its own host name: authors may write raw HTML into pages, and that HTML must never run on the
# origin that holds the CMS session. For the same reason previews have their own host (a sibling of the CMS, so the
# preview cookie works inside the editor's frame): "preview": { "origin": "https://preview.example.com" }.
# Share links show built pages with the site's scripts to anyone with the link, so they have a host of their own too:
# "share": { "origin": "https://share.example.com" }. Never the site's own host name: a shared draft must not look
# like a live page, and search engines must not find it (Markstage says noindex on every answer there).

upstream markstage {
  server 127.0.0.1:18231;
}

upstream markstage_preview {
  server 127.0.0.1:18245;
}

upstream markstage_share {
  server 127.0.0.1:18251;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# A share link's address holds its token. The share host's access log writes /share/[link] in its place (in the
# request line and in a referrer); Markstage's own audit names the link by its id.
map $request $markstage_request {
  "~^(?<verb>\S+) /share/[^ ?]*(?<rest>.*)$" "$verb /share/[link]$rest";
  default $request;
}

map $http_referer $markstage_referer {
  "~^(?<before>[^?#]*?)/share/[^/?#]*(?<after>.*)$" "$before/share/[link]$after";
  default $http_referer;
}

log_format markstage_redacted '$remote_addr - $remote_user [$time_local] "$markstage_request" $status $body_bytes_sent "$markstage_referer" "$http_user_agent"';

server {
  listen 80;
  listen [::]:80;
  server_name www.example.com cms.example.com preview.example.com share.example.com;
  access_log /var/log/nginx/access.log markstage_redacted;
  return 301 https://$host$request_uri;
}

# --- the CMS ---------------------------------------------------------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name cms.example.com;
  ssl_certificate     /etc/letsencrypt/live/cms.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cms.example.com/privkey.pem;
  server_tokens off;
  client_max_body_size 12m;   # media uploads (media.maxBytes 10 MB) plus headroom

  location = / {
    return 302 /markstage/;
  }
  location / {
    proxy_pass http://markstage;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
}

# --- previews (the site's dev server behind Markstage; HMR websocket included) ------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name preview.example.com;
  ssl_certificate     /etc/letsencrypt/live/preview.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/preview.example.com/privkey.pem;
  server_tokens off;

  location / {
    proxy_pass http://markstage_preview;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;   # the first preview starts the dev server
  }
}

# --- share links (a release's or a draft's preview build; read only; the token works once, then a cookie) ---------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name share.example.com;
  ssl_certificate     /etc/letsencrypt/live/share.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/share.example.com/privkey.pem;
  server_tokens off;
  # a share link's address holds its token: logged as /share/[link]. nginx writes the request line into its error
  # log entries too, which cannot be rewritten, so this host logs only critical errors (Markstage logs its own).
  access_log /var/log/nginx/access.log markstage_redacted;
  error_log /var/log/nginx/error.log crit;

  location / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://markstage_share;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }
}

# --- the site --------------------------------------------------------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.example.com;
  ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;
  server_tokens off;
  root /srv/site/current/public;
  # The site's own rules (redirects, headers) go here. nginx reads files the build generates (maps, includes) only
  # at reload: give markstage-deploy an after-switch reload, e.g.  -- sudo -n /usr/sbin/nginx -s reload

  # nginx files the build emits (redirect maps, includes) are server config, not pages
  location ^~ /_nginx/ {
    return 404;
  }

  # PDFs are stored as uploaded (never re-encoded, docs/SECURITY.md "Uploads"): served as downloads, never opened
  # in the browser on the site's origin, and never sniffed into something else
  location ~* \.pdf$ {
    try_files $uri =404;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # $uri/index.html, not $uri/: a protected page's folder can still exist in the public build (it holds public
  # child pages), and `$uri/` would match that folder and answer 403 instead of asking Markstage
  location / {
    try_files $uri $uri/index.html @protected;
  }

  # Not in the public build: perhaps a protected page. Markstage says 204 for a valid page cookie, else 401.
  # If Markstage is down, the subrequest fails and nginx answers 500: protected pages fail closed.
  location @protected {
    auth_request /markstage/page-auth;
    error_page 401 = @gate;
    root /srv/site/current/private;
    try_files $uri $uri/index.html =404;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
  }

  location = /markstage/page-auth {
    internal;
    proxy_pass http://markstage;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;                    # must match protectedPages.hosts
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # No valid cookie: Markstage shows the password form for a protected page, or 404 (then the site's 404 page).
  location @gate {
    proxy_pass http://markstage;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_intercept_errors on;
    error_page 404 /404.html;
  }

  # The password form (rate-limited by Markstage, sets the page cookie) and the site's forms post here.
  location /markstage/ {
    proxy_pass http://markstage;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 64k;
  }

  error_page 404 /404.html;
}
